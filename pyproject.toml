[project]
name = "hipjsw"
dynamic = ["version"]
dependencies = [
  "circle_fit",
  "imageio",
  "matplotlib",
  "numpy",
  "onnxruntime",
  "pandas",
  "scikit-image",
  "scipy",
  "pydicom",
]
requires-python = ">=3.8"
authors = [
  { "name" = "Gijs van Tulder" },
]
description = "Measuring joint space width in hip X-rays"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CSE.*"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.scripts]
hipjsw = "hipjsw.compute_jsw:hipjsw_cli"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hipjsw/__init__.py"

[tool.hatch.build.targets.sdist]
packages = ["src/hipjsw"]

[tool.hatch.build.targets.wheel]
packages = ["src/hipjsw"]
